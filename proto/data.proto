syntax = "proto3";

package testdata;

option java_package = "com.github.subhajitdas298.testdataprotos";
option java_outer_classname = "DataProtos";
option java_multiple_files = true;

// Root holds the top-level data list.
message Root {
  repeated DataEntry data = 1;
}

// DataEntry wraps a single date object inside the data list.
message DataEntry {
  Date date = 1;
}

// Date contains a repeated string field 'a'.
message Date {
  repeated string a = 1;
}
