syntax = "proto3";

package testdata;

option java_package = "com.github.subhajitdas298.testdataprotos";
option java_outer_classname = "DataProtos";
option java_multiple_files = true;

// Root holds the top-level data list.
message Root {
  repeated DataEntry data = 1;
}

// DataEntry holds multiple date records.
message DataEntry {
  repeated DateRecord dates = 1;
}

// DateRecord contains 26 repeated-double fields, one for each letter a–z.
message DateRecord {
  repeated double a = 1;
  repeated double b = 2;
  repeated double c = 3;
  repeated double d = 4;
  repeated double e = 5;
  repeated double f = 6;
  repeated double g = 7;
  repeated double h = 8;
  repeated double i = 9;
  repeated double j = 10;
  repeated double k = 11;
  repeated double l = 12;
  repeated double m = 13;
  repeated double n = 14;
  repeated double o = 15;
  repeated double p = 16;
  repeated double q = 17;
  repeated double r = 18;
  repeated double s = 19;
  repeated double t = 20;
  repeated double u = 21;
  repeated double v = 22;
  repeated double w = 23;
  repeated double x = 24;
  repeated double y = 25;
  repeated double z = 26;
}
